    CreateLoanRequest:
      type: object
      oneOf:
        - required:
            - term
          properties:
            due_date:
              not: {}
        - required:
            - due_date
          properties:
            term:
              not: {}
      properties:
        endpoint_key:
          $ref: '#/components/schemas/LoanProduct'
        requested_amount:
          type: number
          example: 1200000
        term:
          type: number
          example: 120
        due_date:
          type: string
          example: '2099-11-01'
          format: date
        get_details:
          type: boolean
          example: true
        fields:
          type: object
          properties:
            annual_interest_rate:
              type: number
              nullable: true
            disbursement_fee:
              type: number
              nullable: true
            cs_payment_day:
              type: number
              nullable: true
            request_effective_on:
              type: string
              nullable: true
            grace_term:
              type: number
              nullable: true
            interest_fee:
              type: number
              nullable: true
            partner_risk_level:
              $ref: '#/components/schemas/LoanRiskLevel'

      required:
        - product
        - requested_amount
        - fields

    CreateBnplRequest:
      type: object
      required:
        - product
        - amount
        - description
        - term
      properties:
        endpoint_key:
          $ref: '#/components/schemas/LoanProduct'
        amount:
          type: number
          example: 1200000
        description:
          type: string
          example: '0.3,null,null,LOW'
        term:
          type: number
          example: 120

    GetAccessToken:
      type: object
      required:
        - access_token
      properties:
        access_token:
          type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.C5jr84b95N0Shr4reDUym42SLNc0KauYn3b7rBQyY7k'
    CreateDocumentRequest:
      type: object
      required:
        - file
        - type
      properties:
        file:
          type: string
          format: binary
        type:
          type: string
        reference_id:
          type: string
        user_id:
          type: string
        description:
          type: string
    CreateCreditLimitAgreementDocumentRequest:
      type: object
      required:
        - file
        - type
      properties:
        file:
          type: string
          format: binary
        type:
          type: string
        reference_id:
          type: string
        user_id:
          type: string
        description:
          type: string
    UpdateDocumentPayload:
      type: object
      anyOf:
        - required:
            - id
            - type
        - required:
            - id
            - description
        - required:
            - id
            - type
            - description
        - required:
            - id
            - description
            - submission_id
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 24
          maxLength: 24
        description:
          type: string
        type:
          type: string
          nullable: false
        submission_id:
          type: string
    UpdateDocumentsRequest:
      type: array
      minItems: 1
      items:
        $ref: '#/components/schemas/UpdateDocumentPayload'
    Document:
      type: object
      properties:
        id:
          type: string
        reference_id:
          type: string
        type:
          type: string
        description:
          type: string
