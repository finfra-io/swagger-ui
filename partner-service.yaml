openapi: 3.0.0
info:
  version: 1.0.0
  title: 'Finfra API reference'
  description: |
    ## API Reference
    The FINFRA API is designed with a RESTful architecture in mind. With an emphasis on resource-oriented pathways, it supports form-encoded requests and provides responses in JSON format, adhering to conventional HTTP protocols, authentication mechanisms, and methods.
    While interacting with the FINFRA API, users have the ability to engage in a test environment, which has no impact on actual data and does not connect with banking infrastructures. The nature of the API key used during requests is pivotal, as it determines whether the actions are affecting the live environment or are restricted to test mode.
    Bulk operations are not a feature supported by the FINFRA API; actions are performed on an individual object basis within each request.
    Performance and reliability are paramount, prompting FINFRA to implement regulated rate limits and allocations on the usage of its API endpoints.
    The FINFRA API is dynamic and evolves with the introduction of new versions and bespoke functionality tailored to each account. Users are encouraged to log in to access documentation that is specifically tailored to their version of the API and to explore the API using their unique test credentials and datasets.
  license:
    name: 'unlicense'
    url: 'https://unlicense.org'
servers:
  - description: development environment
    url: 'https://partner-service-stg-dev-public.elp.finfra.io'
  - description: Live environment
    url: 'https://partner-service.elp.finfra.io'
tags:
  - name: Authentication
    description: |
      Authentication
      FINFRA API authenticates via API keys accessible within the dashboard
      For tighter security, consider restricted keys. <br> Keep your API keys confidential to prevent unauthorized access.
      Never expose them in public repositories or client-side code.
      All API interactions must be over HTTPS; unauthenticated or HTTP requests will be rejected.
      <!-- Escaped XML-like tag -->
  - name: Document
    description: |
      The KYC (Know Your Customer) process necessitates the population of certain documents into our system prior to enabling a partner to create a borrower profile. The following critical steps must be executed in sequence:
      1. Initiate the creation of a Document Object within the system.
      2. Utilize the newly created Document Object to upload the file content accordingly.
      It is imperative that these steps are followed meticulously to ensure compliance with our KYC requirements.
  - name: Borrower
    description: |
      At Finfra, we cater to two distinct categories of borrowers, each represented by the following enumerations:
      - For an individual borrower: `PERSONAL`
      - For a business entity borrower: `BUSINESS`
      Please ensure that the appropriate enumeration is provided when initiating processes, as each borrower type is subject to a different procedural workflow. Accurate enumeration is critical to ensure compliance with our tailored service protocols.
  - name: Finfra Loan Services
    description: |
      -
  - name: Error Status and Healthcheck
    description: |
      for checking purpose
paths:
  /:
    get:
      tags:
        - Error Status and Healthcheck
      operationId: getRoot
      summary: <Root> checking service status
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Root'
        400:
          description: example error 400 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
  /healthcheck/liveness:
    get:
      security: []
      summary: 'Liveness check'
      tags:
        - Error Status and Healthcheck
      operationId: getLiveness
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Healthcheck'
        400:
          description: example error 400 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
  /healthcheck/readiness:
    get:
      security: []
      tags:
        - Error Status and Healthcheck
      operationId: getReadiness
      summary: 'Readiness check'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Root'
        400:
          description: example error 400 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'

  /api/auth/token:
    post:
      security:
        - BasicAuth: []
      tags:
        - Authentication
      operationId: generateAccessToken
      summary: Generate access token
      parameters:
        - $ref: '#/components/parameters/clientVersion'
        - $ref: '#/components/parameters/teamName'
        - $ref: '#/components/parameters/serviceName'
      x-codeSamples:
        - lang: curl
          label: cURL Example
          source: |
            curl -X POST {server}/api/auth/token -H "Authorization: Bearer yourAccessToken"
      responses:
        200:
          description: An access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAccessToken'
        400:
          description: example error 400 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
        415:
          description: example error 415 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error415Response'
        500:
          description: example error 500 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500Response'

  /api/core/users/{userId}:
    get:
      security:
        - BearerAuth: []
      tags:
        - Borrower
      operationId: getSinglePartnerUsers
      parameters:
        - $ref: '#/components/parameters/userId'
      responses:
        200:
          description: A borrower
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    patch:
      security: []
      tags:
        - Borrower
      operationId: updateSinglePartnerUsers
      summary: Update single partner borrower
      parameters:
        - $ref: '#/components/parameters/userId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        200:
          description: Success update borrower
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        400:
          description: example error 400 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
        415:
          description: example error 415 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error415Response'
        500:
          description: example error 500 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500Response'
  /api/core/users/score-report:
    post:
      security:
        - BearerAuth: []
      tags:
        - Borrower
      operationId: getBorrowerCreditScore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/scoreReportRequest'
      responses:
        200:
          description: A borrower credit score
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/scoreReport'

  /api/core/users/{identityNumber}/credit-history:
    get:
      security:
        - BearerAuth: []
      tags:
        - Borrower
      operationId: creditHistory
      summary: Request Credit History
      parameters:
        - $ref: '#/components/parameters/identityNumber'
      responses:
        200:
          description: Success request credit history
        400:
          description: example error 400 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
        415:
          description: example error 415 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error415Response'
        500:
          description: example error 500 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500Response'

  /api/core/users/credit-limit-agreement:
    post:
      tags:
        - Borrower
      operationId: createCrediLimitAgreementDocument
      summary: Create credit limit aggreement document object
      description: Create credit limit aggreement document object
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateCreditLimitAgreementDocumentRequest'
      responses:
        201:
          $ref: '#/components/responses/CreateDocument'
        400:
          $ref: '#/components/responses/Error400'
        401:
          $ref: '#/components/responses/Error401'
        409:
          $ref: '#/components/responses/Error409'
        429:
          $ref: '#/components/responses/Error429'
        500:
          $ref: '#/components/responses/Error500'

  /api/documents:
    post:
      tags:
        - Document
      operationId: createDocument
      summary: Create document object
      description: Create document object
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateDocumentRequest'
      responses:
        201:
          $ref: '#/components/responses/CreateDocument'
        400:
          $ref: '#/components/responses/Error400'
        401:
          $ref: '#/components/responses/Error401'
        409:
          $ref: '#/components/responses/Error409'
        429:
          $ref: '#/components/responses/Error429'
        500:
          $ref: '#/components/responses/Error500'
    patch:
      tags:
        - Document
      operationId: updateDocuments
      summary: Update multiple documents description and type
      description: Update multiple documents description and type
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDocumentsRequest'
      responses:
        200:
          $ref: '#/components/responses/UpdateDocuments'
        400:
          $ref: '#/components/responses/Error400'
        401:
          $ref: '#/components/responses/Error401'
        403:
          $ref: '#/components/responses/Error403'
        404:
          $ref: '#/components/responses/Error404'
        500:
          $ref: '#/components/responses/Error500'

  /api/core/loans:
    get:
      tags:
        - Finfra Loan Services
      operationId: getLoanList
      parameters:
        - $ref: '#/components/parameters/userIdQ'
        - $ref: '#/components/parameters/uniqueIdQ'
        - $ref: '#/components/parameters/pageNumber'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/startRangeAmountQ'
        - $ref: '#/components/parameters/endRangeAmountQ'
        - $ref: '#/components/parameters/startDateQ'
        - $ref: '#/components/parameters/endDateQ'

      responses:
        200:
          description: list loan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanList'

  /api/core/loans/{userId}:
    post:
      security:
        - BearerAuth: []
      tags:
        - Finfra Loan Services
      parameters:
        - $ref: '#/components/parameters/userId'
      operationId: createLoan
      summary: Create Single Payment Loans
      description: Our Single Payment Loan API is ideal for partners looking to offer financing options such as project financing loans or cash loans that require a singular repayment event. This type of loan is borrowed and must be fully repaid in a lump sum by a specific date, generally aligned with the loan’s maturity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLoanRequest'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Loan'
        400:
          description: example error 400 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'

  /api/core/loans/details/{uniqueId}:
    get:
      tags:
        - Finfra Loan Services
      operationId: getLoanDetail
      parameters:
        - $ref: '#/components/parameters/uniqueId'

      responses:
        200:
          description: detal loan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanListItem'

  /api/core/loans/{userId}/bnpl:
    post:
      security:
        - BearerAuth: []
      tags:
        - Finfra Loan Services
      parameters:
        - $ref: '#/components/parameters/userId'
      operationId: createBnpl
      summary: Create Installment Payment Loans
      description: The Installment Loan API provides partners with the capability to set up loans that are repaid in regular, scheduled installments - weekly, monthly, or biweekly. This is particularly beneficial for implementing Buy Now, Pay Later (BNPL) solutions. Each payment is methodically apportioned to cover both the principal and the interest, effectively managing the loan balance over its term.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBnplRequest'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlag'
        400:
          description: example error 400 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'

  /api/core/loans/{loanUniqueId}/disbursement:
    post:
      security:
        - BearerAuth: []
      tags:
        - Finfra Disbursement Services
      parameters:
        - $ref: '#/components/parameters/loanUniqueId'
      operationId: disbursement
      summary: Disburse loan
      description: This endpoint will initiate disburse the loan money
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlag'
        400:
          description: example error 400 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'

  /errors/{error_code}:
    get:
      security: []
      tags:
        - Error Status and Healthcheck
      operationId: getErrorExample
      summary: 'Error example'
      parameters:
        - name: error_code
          in: path
          description: Error HTTP code
          required: true
          schema:
            type: string
            enum: ['200', '400', '403', '422', '500']
      responses:
        200:
          description: default response, instruction to use this endpoint
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        400:
          description: example error 400 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'
        401:
          description: example error 401 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401Response'
        403:
          description: example error 403 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error403Response'
        404:
          description: example error 404 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404Response'
        422:
          description: example error 422 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error422Response'
        429:
          description: example error 429 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error429Response'
        500:
          description: example error 500 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500Response'

  /api/feature-flag:
    get:
      tags:
        - Error Status and Healthcheck
      operationId: getFeatureFlag
      summary: Get feature flag
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlag'
        400:
          description: example error 400 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400Response'

components:
  schemas:
    Root:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: 'OK'
    Healthcheck:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: 'OK'
    FeatureFlag:
      type: object
      required:
        - key
        - value
      properties:
        key:
          type: string
          example: 'test-feature-flag'
        value:
          type: boolean
          example: false
    User:
      type: object
      required:
        - _id
        - partnerId
        - authorisedSignatory
        - status
        - swiftCode
        - createdAt
        - updatedAt
      properties:
        _id:
          type: string
          example: '1234567890abcdef'
        partnerId:
          type: string
          example: '1234567890abcdef-1234567890abcdef-1234567890abcdef'
        entity:
          $ref: '#/components/schemas/UserEntity'
        authorisedSignatory:
          $ref: '#/components/schemas/UserAuthorisedSignatory'
        swiftCode:
          type: string
          example: 'BMRIIDJA'
        status:
          type: string
          example: 'CREATED'
          enum:
            - CREATED
            - ENGINE_CHECK_PASSED
            - APPROVED_BY_PARTNER
            - BLOCKED
            - INACTIVE
        createdAt:
          type: string
          example: '2023-09-04T06:19:06.525+0000'
        updatedAt:
          type: string
          example: '2023-09-04T06:19:06.525+0000'
        rdf:
          $ref: '#/components/schemas/UserRdf'

    CheckUserHub:
      type: object
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        status:
          type: string
          enum: [ENGINE_CHECK_PASSED, ENGINE_CHECK_FAILED, OTHER_STATUS]
        checking:
          type: object
          properties:
            status:
              type: string
              enum: [SUCCESS, FAILED]
            reason:
              type: string

    scoreReportRequest:
      type: object
      required:
        - user_id
      properties:
        userId:
          type: string
          example: '1234567890abcdef-1234567890abcdef-1234567890abcdef'

    scoreReport:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        nik:
          type: string
        pdf_clik_link:
          type: string
        pdf_afpi_link:
          type: string

    CreateUserRequest:
      type: object
      required:
        - type
        - authorised_signatory
      properties:
        type:
          type: string
          enum:
            - PERSONAL
            - BUSINESS
          example: 'BUSINESS'
        entity:
          $ref: '#/components/schemas/UserEntity'
        authorised_signatory:
          $ref: '#/components/schemas/UserAuthorisedSignatory'
    UpdateUserRequest:
      type: object
      required:
        - authorised_signatory
      properties:
        entity:
          $ref: '#/components/schemas/UpdateUserEntity'
        authorised_signatory:
          $ref: '#/components/schemas/UpdateUserAuthorisedSignatory'

    UpdateUserEntity:
      type: object
      description: 'User entity required if user.type is BUSINESS'
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 60
          example: 'company name'
        address:
          allOf:
            - $ref: '#/components/schemas/Address'
            - $ref: '#/components/schemas/AddressPostalCode'
        phone_number:
          type: string
          description: 'phone number in E.164 format'
          pattern: '^\+62\d{1,14}$'
          minLength: 5
          maxLength: 20
          example: '+6287711998822'
        fax:
          type: string
          description: 'Entity phone number in E.164 format'
          pattern: '^\+62\d{1,14}$'
          minLength: 3
          maxLength: 20
          example: '+622133442233'
        email:
          type: string
          format: email
          description: 'Email address of authorised signatory'
          minLength: 6
          maxLength: 128
        business_type:
          $ref: '#/components/schemas/UserBusinessTypeCommonEnum'
        industry:
          $ref: '#/components/schemas/UserIndustryCommonEnum'
        nationality:
          $ref: '#/components/schemas/CountryCode'
        residence:
          $ref: '#/components/schemas/CountryCode'
        npwp:
          type: string
          minLength: 15
          maxLength: 16
          example: '081785542123321'
        phone_ext:
          type: string
          description: 'optional'
          example: '+6285633122'
        legal_entity:
          type: string
          example: 'PT'
          enum:
            - PT
            - CV
            - UD
            - FIRM
            - OTHER
        establishment_date:
          type: string
          example: '1995-11-01'
          format: date
        managements:
          $ref: '#/components/schemas/UserEntityManagements'
        establishment_place:
          type: string
          example: 'Jakarta'
        establishment_number:
          type: string
          example: 'SK/1231/29032'

    UpdateUserAuthorisedSignatory:
      type: object
      description: 'Authorised Signatory'
      properties:
        marital_status:
          $ref: '#/components/schemas/MaritalEnum'
        gender:
          $ref: '#/components/schemas/GenderEnum'
        title:
          $ref: '#/components/schemas/TitleEnum'
        domicile:
          $ref: '#/components/schemas/CountryCode'
        religion:
          $ref: '#/components/schemas/ReligionEnum'
        job:
          $ref: '#/components/schemas/JobEnum'
        education:
          $ref: '#/components/schemas/EducationEnum'
        address:
          allOf:
            - $ref: '#/components/schemas/Address'
            - $ref: '#/components/schemas/AddressPostalCode'
            - $ref: '#/components/schemas/AddressCountry'
        bank_account:
          $ref: '#/components/schemas/UserBankAccount'

        business_type:
          $ref: '#/components/schemas/UserBusinessTypeCommonEnum'
        monthly_income_range:
          $ref: '#/components/schemas/UserMonthlyIncomeRangeEnum'
        housing_status:
          $ref: '#/components/schemas/UserHousingStatusEnum'
        source_of_fund:
          $ref: '#/components/schemas/UserSourceOfFundEnum'

    CreditHistoryRequest:
      type: object
      required:
        - nik
        - mobileNumber
      properties:
        nik:
          type: string
          minLength: 16
          maxLength: 16
        mobileNumber:
          type: string
          description: 'Phone number of the management representative in E.164 format'
          pattern: '^\+62\d{1,14}$'
          minLength: 10
          maxLength: 20
          example: '+6281274384381'

    LoanList:
      properties:
        data:
          type: array
          description: 'list of loan'
          items:
            $ref: '#/components/schemas/LoanListItem'
        current_page:
          type: number
          example: 1
        total_pages:
          type: number
          example: 1
        count:
          type: number
          example: 1

    LoanListItem:
      type: object
      required:
        - id
        - partner_id
        - user
        - product
        - amount
        - term
      properties:
        id:
          type: string
          example: '7097bbbb-1ffa-47aa-8cb4-ad01e9e73762'
        partner_id:
          type: string
          example: '7097bbbb-1ffa-47aa-8cb4-ad01e9e73762'
        user_id:
          type: string
          example: '7097bbbb-1ffa-47aa-8cb4-ad01e9e73762'
        product:
          $ref: '#/components/schemas/LoanProduct'
        amount:
          type: number
          example: 12000000
        term:
          type: number
          example: 120
        data:
          type: object
          properties:
            annual_interest_rate:
              type: number
            disbursement_fee:
              type: number
            grace_term:
              type: number
            interest_fee:
              type: number
            risk_level:
              $ref: '#/components/schemas/LoanRiskLevel'

    Loan:
      type: object
      required:
        - id
        - partnerId
        - user
        - product
        - amount
        - term
      properties:
        id:
          type: string
          example: '6544de568f002963846527e0'
        partnerId:
          type: string
          example: '7097bbbb-1ffa-47aa-8cb4-ad01e9e73762'
        userId:
          type: string
          example: '6544de568f002963846527e0'
        product:
          $ref: '#/components/schemas/LoanProduct'
        amount:
          type: number
          example: 12000000
        term:
          type: number
          example: 120
        data:
          type: object
          properties:
            annualInterestRate:
              type: number
            disbursementFee:
              type: number
            graceTerm:
              type: number
            interestFee:
              type: number
            riskLevel:
              $ref: '#/components/schemas/LoanRiskLevel'

    LoanRiskLevel:
      type: string
      example: 'VERY_LOW'
      enum:
        - VERY_LOW
        - LOW
        - MEDIUM
        - HIGH
        - VERY_HIGH
        - NOT_AVAILABLE
    LoanProduct:
      type: string
      example: finfra_sandbox_wr_IL_weekly
      enum:
        - finfra_stg_dev_wr_spl
        - finfra_stg_dev_wr_il_weekly
        - finfra_stg_dev_wr_il_biweekly
        - finfra_stg_dev_wr_il_monthly
        - finfra_stg_dev_ir_spl
        - finfra_stg_dev_ir_il_weekly
        - finfra_stg_dev_ir_il_biweekly
        - finfra_stg_dev_ir_il_monthly
        - finfra_stg_dev_pf_spl
        - finfra_stg_dev_pf_il_weekly
        - finfra_stg_dev_pf_il_biweekly
