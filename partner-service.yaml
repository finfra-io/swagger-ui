    UserEntity:
      type: object
      description: 'User entity required if user.type is BUSINESS'
      required:
        - name
        - npwp
        - email
        - legal_entity
        - address
        - establishment_date
        - establishment_place
        - deed_date
        - deed_number
        - industry
        - nationality
        - managements
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 60
          example: 'company name'
        address:
          allOf:
            - $ref: '#/components/schemas/Address'
            - $ref: '#/components/schemas/AddressPostalCode'
        phone_number:
          type: string
          description: 'phone number in E.164 format'
          pattern: '^\+62\d{1,14}$'
          minLength: 5
          maxLength: 20
          example: '+6287711998822'
        fax:
          type: string
          description: 'Entity phone number in E.164 format'
          pattern: '^\+62\d{1,14}$'
          minLength: 3
          maxLength: 20
          example: '+622133442233'
        email:
          type: string
          format: email
          description: 'Email address of authorised signatory'
          minLength: 6
          maxLength: 128
        business_type:
          $ref: '#/components/schemas/UserBusinessTypeCommonEnum'
        industry:
          $ref: '#/components/schemas/UserIndustryCommonEnum'
        nationality:
          $ref: '#/components/schemas/CountryCode'
        residence:
          $ref: '#/components/schemas/CountryCode'
        npwp:
          type: string
          minLength: 15
          maxLength: 16
          example: '081785542123321'
        phone_ext:
          type: string
          description: 'optional'
          example: '+6285633122'
        legal_entity:
          type: string
          example: 'PT'
          enum:
            - PT
            - CV
            - UD
            - FIRM
            - OTHER
        establishment_date:
          type: string
          example: '1995-11-01'
          format: date
        managements:
          $ref: '#/components/schemas/UserEntityManagements'
        establishment_place:
          type: string
          example: 'Jakarta'
        deed_date:
          type: string
          example: '1995-11-01'
          format: date
        deed_number:
          type: string
          example: 'SK/1231/29032'

    UserAuthorisedSignatory:
      type: object
      required:
        - first_name
        - birth_date
        - birth_place
        - email
        - mother_maiden_name
        - marital_status
        - domicile
        - religion
        - gender
        - job
        - education
        - address
        - mobile_number
        - bank_account
        - documents
        - business_type
        - monthly_income_range
        - emergency_contact_name
        - emergency_contact_number
        - housing_status
        - source_of_fund
      description: 'Authorised Signatory'
      properties:
        first_name:
          type: string
          minLength: 2
          maxLength: 30
          description: 'First name of authorised signatory'
          example: 'jhon'
        last_name:
          type: string
          example: 'doe'
          description: 'Last name of authorised signatory'
        birth_date:
          type: string
          example: '1995-11-01'
          format: date
          minLength: 10
        birth_place:
          type: string
          minLength: 3
          maxLength: 30
          example: 'Kab. Semarang'
        email:
          type: string
          format: email
          description: 'Email address of authorised signatory'
          minLength: 5
          maxLength: 64
        motherMaidenName:
          type: string
          description: 'Mother maiden name of authorised signatory'
          minLength: 2
          maxLength: 30
          example: 'sri ratu'
        marital_status:
          $ref: '#/components/schemas/MaritalEnum'
        gender:
          $ref: '#/components/schemas/GenderEnum'
        title:
          $ref: '#/components/schemas/TitleEnum'
        domicile:
          $ref: '#/components/schemas/CountryCode'
        religion:
          $ref: '#/components/schemas/ReligionEnum'
        job:
          $ref: '#/components/schemas/JobEnum'
        education:
          $ref: '#/components/schemas/EducationEnum'
        address:
          allOf:
            - $ref: '#/components/schemas/Address'
            - $ref: '#/components/schemas/AddressPostalCode'
            - $ref: '#/components/schemas/AddressCountry'
        mobile_number:
          type: string
          description: 'Mobile number of the authorised signatory in E.164 format'
          pattern: '^\+62\d{1,14}$'
          minLength: 5
          maxLength: 20
          example: '+6281274384381'
        bank_account:
          $ref: '#/components/schemas/UserBankAccount'
        documents:
          type: object
          required:
            - ktp
          properties:
            ktp:
              type: object
              required:
                - number
              properties:
                number:
                  type: string
                  pattern: '^(1[1-9]|21|[12356789][1-9]|5[1-3]|6[1-5]|[89][12])\d{2}\d{2}([04][1-9]|[1256][0-9]|[37][01])(0[1-9]|1[0-2])\d{2}\d{4}$'
                  minLength: 16
                  maxLength: 16
                  example: '3275062009921981'
                file:
                  type: string
                  description: 'The id of KTP document'
                  pattern: '^[a-f\d]{24}$'
                  minLength: 5
                issuing_city:
                  type: string
                  minLength: 3
                  maxLength: 30
                  example: 'Semarang'
                expiry_date:
                  type: string
                  example: '2099-11-01'
                  format: date
                  minLength: 10
                  maxLength: 10
            selfie:
              type: object
              properties:
                file:
                  type: string
                  description: 'The id of selfie document'
                  pattern: '^[a-f\d]{24}$'
                  minLength: 5
            npwp:
              type: object
              properties:
                number:
                  type: string
                  minLength: 15
                  maxLength: 16
                  example: '081785542123321'
        business_type:
          $ref: '#/components/schemas/UserBusinessTypeCommonEnum'
        monthly_income_range:
          $ref: '#/components/schemas/UserMonthlyIncomeRangeEnum'
        emergency_contact_name:
          type: string
          example: 'Humairah'
          minLength: 2
          maxLength: 50
        emergency_contact_number:
          type: string
          example: '08123456789'
        housing_status:
          $ref: '#/components/schemas/UserHousingStatusEnum'
        source_of_fund:
          $ref: '#/components/schemas/UserSourceOfFundEnum'

