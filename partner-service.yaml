      required: false
      explode: true
      schema:
        type: string
    entityEmail:
      name: entityEmail
      in: query
      description: Company email values that need to be considered for get by email
      required: false
      explode: true
      schema:
        type: string
    phone:
      name: phone
      in: query
      description: Phone values that need to be considered for get by phone
      required: false
      explode: true
      schema:
        type: string
    email:
      name: email
      in: query
      description: Email values that need to be considered for get by email
      required: false
      explode: true
      schema:
        type: string
    nik:
      name: nik
      in: query
      description: NIK values that need to be considered for get by NIK
      required: false
      explode: true
      schema:
        type: string
    userIdQ:
      in: query
      name: userId
      schema:
        type: string
    uniqueIdQ:
