        CodeCharacteristicCreditDesc:
          nullable: true
          type: string

    SubjectSequenceMember:
      nullable: true
      type: object
      properties:
        SubjectSequenceMember:
          nullable: true
          type: string

    Error400Response:
      type: object
      required:
        - error_code
        - message
      properties:
        error_code:
          type: string
          enum:
            - API_VALIDATION_ERROR
            - CREDIT_CARD_DATA_ERROR
            - INVALID_JSON_FORMAT
            - UNREGISTERED_PRODUCT_ERROR
            - PRODUCT_NOT_ACTIVE
            - NO_PAYMENT_CHANNEL_FOUND
            - INVALID_USER_ID
            - FILE_TYPE_UNSUPPORTED
            - INVALID_DOCUMENT_ID
            - BIOMETRIC_VERIFICATION_ERROR
        message:
          type: string
        errors:
          $ref: '#/components/schemas/ArrayOfErrors'
    Error401Response:
      type: object
      required:
        - error_code
        - message
      properties:
        error_code:
          type: string
          enum:
            - INVALID_EMAIL_OR_PASSWORD
            - INVALID_TOKEN
            - INVALID_CREDENTIAL
            - EXPIRED_SESSION
            - AUTHORIZATION_NOT_FOUND
            - KEY_NOT_VALID
            - CREDIT_CARD_CHARGE_NOT_FOUND_ERROR
        message:
          type: string
        errors:
          $ref: '#/components/schemas/ArrayOfErrors'
    Error403Response:
      type: object
      required:
        - error_code
        - message
      properties:
        error_code:
          type: string
          enum:
            - REQUEST_FORBIDDEN_ERROR
        message:
          type: string
        errors:
          $ref: '#/components/schemas/ArrayOfErrors'
    Error404Response:
      type: object
      required:
        - error_code
        - message
      properties:
        error_code:
          type: string
          enum:
            - PARTNER_NOT_FOUND
            - USER_NOT_FOUND
            - USER_ID_NOT_FOUND
            - LOAN_ID_NOT_FOUND
            - UNIQUE_ID_NOT_FOUND
            - NO_ACTIVE_USER_FOUND
            - DOCUMENT_NOT_FOUND
            - CREDIT_HISTORY_NOT_FOUND
        message:
          type: string
        errors:
          $ref: '#/components/schemas/ArrayOfErrors'
    Error409Response:
      type: object
      required:
        - error_code
        - message
      properties:
        error_code:
          type: string
          enum:
            - DUPLICATE_REFERENCE_ID
            - FILE_TOO_BIG
            - DUPLICATE_EMAIL
            - DUPLICATE_DATA
        message:
          type: string
    Error415Response:
      type: object
      required:
        - message
      properties:
        message:
          type: string
        errors:
          $ref: '#/components/schemas/ArrayOfErrors'

    Error422Response:
      type: object
      required:
        - error_code
        - message
      properties:
        error_code:
          type: string
          enum:
            - GENERATE_CHECKOUT_URL_ERROR
            - DUPLICATE_PAYMENT_ERROR
        message:
          type: string
        errors:
          $ref: '#/components/schemas/ArrayOfErrors'
    Error429Response:
      type: object
      required:
        - error_code
        - message
      properties:
        message:
          type: string
    Error500Response:
      type: object
      required:
        - error_code
        - message
      properties:
        error_code:
          type: string
          enum:
            - INTERNAL_SERVER_ERROR
            - INTERNAL_UPSTREAM_ERROR
        message:
          type: string
        errors:
          $ref: '#/components/schemas/ArrayOfErrors'
    ArrayOfErrors:
      nullable: true
      type: array
      items:
        oneOf:
          - type: string
          - type: object
  parameters:
    clientVersion:
      in: header
      name: client-version
      description: The requester's client version used to access this service
      schema:
        type: string
        example: 'v1.0.0'
      required: false
    teamName:
      in: header
      name: team-name
      description: The requester's team [link](https://docs.google.com/document/d/1Bvs1A7VJwribkS9WM-s96ikXxgNa0fZrvLyLrIH811s/edit#heading=h.msfrxiz473dv)
      schema:
        type: string
        example: disbursement
      required: false
    serviceName:
      in: header
      name: service-name
      description: The requester's service name
      schema:
        type: string
        example: disbursement-service
      required: false
    userId:
      in: path
      name: userId
      required: true
      schema:
        type: string
        example: '1234567890abcdef-1234567890abcdef-1234567890abcdef'
    loanUniqueId:
      in: path
      name: loanUniqueId
      required: true
      schema:
        type: string
        example: '1234567890abcdef-1234567890abcdef-1234567890abcdef:123abcdef4578:1234567890abcdef-1234567890abcdef-1234567890abcdef'
    callbackTitle:
      in: path
      name: callbackTitle
      schema:
        type: string
        enum:
          - user-creation
          - user-verify
          - user-score
          - loan-status
          - bnpl-status
          - credit-history-doc
          - disbursement-creation
      required: true
    endpointKey:
      in: path
      name: endpointKey
      schema:
        type: string
        enum:
          - user-verify
          - user-score
      required: true
    partnerId:
      in: header
      name: partner-id
      schema:
        type: string
        minLength: 6
      required: true
    search:
      name: search
      in: query
      description: Status values that need to be considered for filter
      required: false
      explode: true
      schema:
        type: string
    borrowerStatus:
      name: status
      in: query
      description: Status values that need to be considered for filter
      required: false
      explode: true
      schema:
        type: string
        enum:
          - all
    filter:
      name: filter
      in: query
      description: Status values that need to be considered for filter
      required: false
      explode: true
      schema:
        type: string
    pageNumber:
      name: pageNumber
      in: query
      description: Status values that need to be considered for filter
      required: false
      explode: true
      schema:
        type: number
        default: 0
    pageSize:
      name: pageSize
      in: query
      description: Status values that need to be considered for filter
      required: false
      explode: true
      schema:
        type: number
        default: 10
    createTransaction:
      name: createTransaction
      in: query
      description: This for loan simulation, if this value is passed then loan creation will be processed otherwise it will run only simulation.
      required: false
      explode: true
      schema:
        type: string
    entityPhone:
      name: entityPhone
      in: query
